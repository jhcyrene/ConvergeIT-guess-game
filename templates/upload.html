<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Upload Dashboard</title>
    <!-- Browser Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/jpcs.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/jpcs.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans text-gray-800">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-xl p-6 border-t-4 border-[#002f6c]">

        <!-- Header -->
        <div
            class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 border-gray-100">
            <div>
                <h1 class="text-3xl font-black text-[#002f6c] tracking-tight">Content Dashboard</h1>
                <p class="text-sm text-gray-500 mt-1">ConvergeIT 2026 Game Database</p>
            </div>
            <a href="/api/scores" target="_blank"
                class="mt-4 md:mt-0 flex items-center text-sm font-semibold text-[#00c2cb] hover:text-[#002f6c] transition-colors hover:underline bg-teal-50 px-4 py-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                View Scores API
            </a>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex space-x-4 mb-6 border-b border-gray-200">
            <button id="tabImageBtn" onclick="switchTab('image')"
                class="py-2 px-1 font-bold text-[#002f6c] border-b-[3px] border-[#002f6c] focus:outline-none transition-all">
                Batch Image Upload
            </button>
            <button id="tabTextBtn" onclick="switchTab('text')"
                class="py-2 px-1 font-bold text-gray-400 hover:text-[#002f6c] border-b-[3px] border-transparent hover:border-gray-300 focus:outline-none transition-all">
                Add Text Question
            </button>
        </div>

        <!-- ================= IMAGE UPLOAD TAB ================= -->
        <div id="imageTabContent" class="block animate-fade-in">
            <!-- File Input Area -->
            <div
                class="mb-6 bg-blue-50/50 p-6 rounded-xl border-2 border-[#002f6c]/20 border-dashed hover:border-[#00c2cb] transition-colors relative">
                <label class="block text-center cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto text-[#002f6c] mb-2" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span class="block text-lg font-bold text-[#002f6c] mb-1">Click to select Multiple Images</span>
                    <span class="block text-sm font-medium text-gray-500 mb-4">Supports Portrait and Landscape</span>
                    <input type="file" id="batchInput" accept="image/*" multiple class="hidden">
                    <span
                        class="inline-block bg-[#00c2cb] text-white text-sm font-bold py-2 px-6 rounded-full shadow-md hover:bg-teal-600 transition-transform transform hover:scale-105">Browse
                        Files</span>
                </label>
            </div>

            <!-- Upload Queue Table -->
            <div class="overflow-x-auto mb-6 rounded-lg border border-gray-200 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-[#002f6c] text-xs uppercase tracking-wider">
                            <th class="p-3 border-b font-bold w-24 text-center">Preview</th>
                            <th class="p-3 border-b font-bold">Filename</th>
                            <th class="p-3 border-b font-bold w-40 text-center">Answer</th>
                            <th class="p-3 border-b font-bold w-48 text-center">Upload Status</th>
                            <th class="p-3 border-b font-bold w-20 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="batchTableBody" class="text-sm bg-white divide-y divide-gray-100">
                        <tr id="emptyState">
                            <td colspan="5" class="p-8 text-center text-gray-400 italic">No files selected for upload
                                yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button id="uploadAllBtn"
                class="hidden w-full py-4 px-4 rounded-xl shadow-lg text-lg font-black text-white bg-[#002f6c] hover:bg-blue-900 transition-all focus:outline-none focus:ring-4 focus:ring-blue-300 transform active:scale-[0.99]">
                UPLOAD ALL IMAGES TO DATABASE
            </button>
        </div>

        <!-- ================= TEXT QUESTION TAB ================= -->
        <div id="textTabContent" class="hidden animate-fade-in">
            <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm mb-6">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-[#002f6c] mb-2 uppercase tracking-wide">Question / Fact
                        Text</label>
                    <textarea id="textQuestionInput" rows="4"
                        class="w-full p-4 border border-gray-300 rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-[#00c2cb] text-lg"
                        placeholder="Type the statement here (e.g., 'In 1999, scientists successfully cloned a human being.')"></textarea>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-[#002f6c] mb-2 uppercase tracking-wide">Is this statement
                        AI-generated or Real?</label>
                    <select id="textIsAi"
                        class="block w-full px-4 py-3 text-lg font-bold bg-white border-2 border-gray-300 rounded-lg focus:outline-none focus:border-[#00c2cb] focus:ring-1 focus:ring-[#00c2cb] cursor-pointer">
                        <option value="false">Real (True Fact)</option>
                        <option value="true">AI (Fake / Generated)</option>
                    </select>
                </div>
                <button id="addTextBtn"
                    class="w-full py-4 px-4 rounded-xl shadow-lg text-lg font-black text-white bg-[#00c2cb] hover:bg-teal-600 transition-all focus:outline-none focus:ring-4 focus:ring-teal-300 transform active:scale-[0.99]">
                    SAVE TEXT QUESTION
                </button>
            </div>
        </div>

        <!-- ================= DATABASE HISTORY TABLE ================= -->
        <div class="mt-12 pt-8 border-t-2 border-gray-100">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-black text-[#002f6c]">Database History</h2>
                <span class="bg-[#002f6c] text-white text-xs font-bold px-3 py-1 rounded-full"><span id="count">0</span>
                    Entries</span>
            </div>

            <div
                class="overflow-x-auto max-h-[500px] border border-gray-200 rounded-xl shadow-inner relative bg-gray-50">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-[#002f6c] shadow-md z-10">
                        <tr class="text-white text-xs uppercase tracking-wider">
                            <th class="p-3 border-b border-[#002f6c] w-24 text-center">Preview</th>
                            <th class="p-3 border-b border-[#002f6c]">Content / Filename</th>
                            <th class="p-3 border-b border-[#002f6c] w-48 text-center">Change Answer</th>
                            <th class="p-3 border-b border-[#002f6c] w-36 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="text-sm bg-white divide-y divide-gray-100">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ================= UNIVERSAL PREVIEW MODAL ================= -->
    <div id="previewModal"
        class="hidden fixed inset-0 z-50 bg-slate-950/95 flex items-center justify-center p-4 md:p-10 transition-opacity">
        <div class="relative max-w-5xl w-full flex justify-center items-center h-full">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 md:-top-4 md:-right-4 text-white hover:text-[#00c2cb] text-5xl font-black focus:outline-none transition-colors drop-shadow-md z-50">&times;</button>

            <!-- Image View (Handles Portrait/Landscape automatically via object-contain) -->
            <img id="modalImage" src="" alt="Full size preview"
                class="hidden w-full h-full max-h-[90vh] object-contain rounded-lg shadow-2xl">

            <!-- Text View -->
            <div id="modalTextContainer"
                class="hidden bg-white w-full max-w-3xl p-8 md:p-14 rounded-3xl shadow-2xl border-4 border-[#002f6c] max-h-[90vh] overflow-y-auto">
                <p id="modalTextContent"
                    class="text-xl md:text-3xl font-medium text-center text-[#002f6c] leading-relaxed">
                </p>
            </div>
        </div>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script>
        // --- Tab Switching Logic ---
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function switchTab(tab) {
            const imgBtn = document.getElementById('tabImageBtn');
            const txtBtn = document.getElementById('tabTextBtn');
            const imgContent = document.getElementById('imageTabContent');
            const txtContent = document.getElementById('textTabContent');

            if (tab === 'image') {
                imgBtn.className = "py-2 px-1 font-bold text-[#002f6c] border-b-[3px] border-[#002f6c] focus:outline-none transition-all";
                txtBtn.className = "py-2 px-1 font-bold text-gray-400 hover:text-[#002f6c] border-b-[3px] border-transparent hover:border-gray-300 focus:outline-none transition-all";
                imgContent.classList.remove('hidden');
                txtContent.classList.add('hidden');
            } else {
                txtBtn.className = "py-2 px-1 font-bold text-[#002f6c] border-b-[3px] border-[#002f6c] focus:outline-none transition-all";
                imgBtn.className = "py-2 px-1 font-bold text-gray-400 hover:text-[#002f6c] border-b-[3px] border-transparent hover:border-gray-300 focus:outline-none transition-all";
                txtContent.classList.remove('hidden');
                imgContent.classList.add('hidden');
            }
        }

        // --- Modal Preview Logic ---
        function openModal(type, content) {
            const imgEl = document.getElementById('modalImage');
            const txtContainerEl = document.getElementById('modalTextContainer');
            const txtContentEl = document.getElementById('modalTextContent');

            if (type === 'text') {
                imgEl.classList.add('hidden');
                txtContainerEl.classList.remove('hidden');
                txtContentEl.innerText = decodeURIComponent(content);
            } else {
                txtContainerEl.classList.add('hidden');
                imgEl.classList.remove('hidden');
                imgEl.src = content;
            }
            document.body.style.overflow = 'hidden'; // Prevent background scroll
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('modalImage').src = '';
            document.getElementById('modalTextContent').innerText = '';
            document.body.style.overflow = 'auto'; // Restore scroll
        }

        // Close modal on background click
        document.getElementById('previewModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // Close modal on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeModal();
        });


        // --- Image Batch Upload Logic ---
        const batchInput = document.getElementById('batchInput');
        const tableBody = document.getElementById('batchTableBody');
        const uploadAllBtn = document.getElementById('uploadAllBtn');
        const emptyState = document.getElementById('emptyState');
        let uploadQueue = [];

        // Handle file selection
        batchInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0 && document.getElementById('emptyState')) {
                document.getElementById('emptyState').remove();
            }

            files.forEach((file) => {
                const rowId = `row_${Math.random().toString(36).substr(2, 9)}`;
                uploadQueue.push({ id: rowId, file: file, uploaded: false });

                const previewUrl = URL.createObjectURL(file);
                const tr = document.createElement('tr');
                tr.id = rowId;
                tr.className = "hover:bg-blue-50 transition-colors";

                tr.innerHTML = `
                    <td class="p-2 text-center align-middle border-b border-gray-100">
                        <div class="h-12 w-16 bg-gray-200 rounded-md overflow-hidden shadow-sm mx-auto cursor-pointer border border-gray-300 hover:border-[#00c2cb]" onclick="openModal('image', '${previewUrl}')">
                            <img src="${previewUrl}" class="h-full w-full object-cover hover:scale-110 transition-transform duration-300" alt="preview">
                        </div>
                    </td>
                    <td class="p-3 align-middle border-b border-gray-100">
                        <div class="truncate max-w-[200px] font-semibold text-gray-700 text-sm" title="${file.name}">${file.name}</div>
                        <div class="text-xs text-gray-400">${(file.size / 1024).toFixed(1)} KB</div>
                    </td>
                    <td class="p-3 align-middle border-b border-gray-100 text-center">
                        <select id="select_${rowId}" class="block w-full px-2 py-1.5 text-sm font-bold bg-white border border-gray-300 rounded focus:outline-none focus:border-[#00c2cb] focus:ring-1 focus:ring-[#00c2cb]">
                            <option value="false" class="text-[#002f6c]">Real</option>
                            <option value="true" class="text-[#00c2cb]">AI</option>
                        </select>
                    </td>
                    <td class="p-3 align-middle border-b border-gray-100">
                        <div class="w-full bg-gray-200 rounded-full h-2 mb-1 overflow-hidden shadow-inner">
                            <div id="progress_${rowId}" class="bg-[#00c2cb] h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <div id="status_${rowId}" class="text-xs font-bold text-gray-500 text-center uppercase tracking-wide">Queued</div>
                    </td>
                    <td class="p-3 text-center align-middle border-b border-gray-100">
                        <button onclick="removeFile('${rowId}')" class="text-red-500 hover:text-white border border-red-500 hover:bg-red-500 text-xs font-bold px-3 py-1 rounded transition-colors shadow-sm">Drop</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            if (uploadQueue.length > 0) uploadAllBtn.classList.remove('hidden');
            batchInput.value = '';
        });

        // Remove from upload queue
        window.removeFile = function (id) {
            uploadQueue = uploadQueue.filter(item => item.id !== id);
            const row = document.getElementById(id);
            if (row) row.remove();

            if (uploadQueue.length === 0) {
                uploadAllBtn.classList.add('hidden');
                tableBody.innerHTML = `<tr id="emptyState"><td colspan="5" class="p-8 text-center text-gray-400 italic">No files selected for upload yet.</td></tr>`;
            }
        };

        // Process Batch Upload array
        uploadAllBtn.addEventListener('click', async () => {
            uploadAllBtn.disabled = true;
            uploadAllBtn.classList.replace('bg-[#002f6c]', 'bg-gray-400');
            uploadAllBtn.innerText = 'UPLOADING... PLEASE WAIT';

            let allSuccess = true;

            for (let item of uploadQueue) {
                if (item.uploaded) continue;

                const isAi = document.getElementById(`select_${item.id}`).value;
                const progress = document.getElementById(`progress_${item.id}`);
                const status = document.getElementById(`status_${item.id}`);

                const formData = new FormData();
                formData.append('type', 'image');
                formData.append('image', item.file);
                formData.append('is_ai', isAi);

                try {
                    status.innerText = "UPLOADING";
                    status.classList.replace('text-gray-500', 'text-blue-500');
                    progress.style.width = "50%";

                    const response = await fetch('/api/upload?true=true', { method: 'POST', body: formData });

                    if (response.ok) {
                        progress.style.width = "100%";
                        progress.classList.replace('bg-[#00c2cb]', 'bg-green-500');
                        status.innerText = "SUCCESS";
                        status.classList.replace('text-blue-500', 'text-green-600');
                        item.uploaded = true;
                    } else { throw new Error('Server response not OK'); }
                } catch (error) {
                    allSuccess = false;
                    status.innerText = "FAILED";
                    status.classList.replace('text-blue-500', 'text-red-500');
                    progress.classList.replace('bg-[#00c2cb]', 'bg-red-500');
                    progress.style.width = "100%";
                }
            }

            if (allSuccess) {
                uploadAllBtn.innerText = 'UPLOAD COMPLETE';
                uploadAllBtn.classList.replace('bg-gray-400', 'bg-green-600');
            } else {
                uploadAllBtn.innerText = 'RETRY FAILED UPLOADS';
                uploadAllBtn.classList.replace('bg-gray-400', 'bg-orange-500');
            }

            setTimeout(() => {
                uploadAllBtn.classList.remove('bg-green-600', 'bg-orange-500', 'bg-gray-400');
                uploadAllBtn.classList.add('bg-[#002f6c]');
                uploadAllBtn.disabled = false;
                uploadAllBtn.innerText = 'UPLOAD ALL IMAGES TO DATABASE';

                // Clear successful uploads from the UI to clean up
                uploadQueue = uploadQueue.filter(item => {
                    if (item.uploaded) { document.getElementById(item.id).remove(); return false; }
                    return true;
                });

                if (uploadQueue.length === 0) {
                    uploadAllBtn.classList.add('hidden');
                    tableBody.innerHTML = `<tr id="emptyState"><td colspan="5" class="p-8 text-center text-gray-400 italic">No files selected for upload yet.</td></tr>`;
                }

            }, 2500);

            loadUploadedData();
        });

        // --- Text Question Logic ---
        document.getElementById('addTextBtn').addEventListener('click', async () => {
            const content = document.getElementById('textQuestionInput').value.trim();
            const isAi = document.getElementById('textIsAi').value;
            const btn = document.getElementById('addTextBtn');

            if (!content) {
                alert("Please type a question or fact statement first.");
                document.getElementById('textQuestionInput').focus();
                return;
            }

            btn.disabled = true;
            btn.innerText = "SAVING QUESTION...";
            btn.classList.replace('bg-[#00c2cb]', 'bg-gray-400');

            const formData = new FormData();
            formData.append('type', 'text');
            formData.append('text_content', content);
            formData.append('is_ai', isAi);

            try {
                const response = await fetch('/api/upload?true=true', { method: 'POST', body: formData });
                if (response.ok) {
                    document.getElementById('textQuestionInput').value = '';
                    btn.innerText = "QUESTION SAVED!";
                    btn.classList.replace('bg-gray-400', 'bg-green-600');
                    loadUploadedData();
                } else {
                    const errData = await response.json().catch(() => ({}));
                    alert(errData.error || "Failed to save text question to server.");
                    btn.innerText = "ERROR SAVING";
                    btn.classList.replace('bg-gray-400', 'bg-red-500');
                }
            } catch (error) {
                console.error("Save error:", error);
                alert("Network error. Could not connect to server.");
                btn.innerText = "NETWORK ERROR";
                btn.classList.replace('bg-gray-400', 'bg-red-500');
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SAVE TEXT QUESTION";
                btn.classList.remove('bg-gray-400', 'bg-green-500', 'bg-green-600', 'bg-red-500');
                btn.classList.add('bg-[#00c2cb]');
            }, 2000);
        });

        // --- Database History Logic ---

        // Fetch and render data
        function loadUploadedData() {
            fetch('/api/data')
                .then(response => {
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    return response.json();
                })
                .then(data => {
                    const countElem = document.getElementById('count');
                    const historyBody = document.getElementById('historyTableBody');
                    if (!historyBody) return;

                    const list = Array.isArray(data) ? data : [];
                    if (countElem) countElem.innerText = list.length;
                    historyBody.innerHTML = '';

                    if (list.length === 0) {
                        historyBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500 italic font-medium">No entries currently in database.</td></tr>`;
                        return;
                    }

                    // Render newest first (clone with slice to avoid mutating array)
                    list.slice().reverse().forEach(item => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-blue-50 transition-colors group";

                        let previewHtml = '';
                        let contentDisplay = '';
                        let encodedContent = '';
                        let isText = item.type === 'text' || (!item.url && !item.filename && Boolean(item.text_content || item.content || item.text));

                        if (isText) {
                            const textContent = item.text_content || item.content || item.text || '';
                            const safeTextContent = escapeHtml(textContent);
                            encodedContent = encodeURIComponent(textContent).replace(/'/g, '%27');
                            previewHtml = `
                                <div class="mx-auto h-12 w-16 bg-blue-100 border border-blue-300 rounded-md flex items-center justify-center cursor-pointer hover:bg-blue-200 transition-colors shadow-sm" onclick="openModal('text', '${encodedContent}')" title="Preview Text">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#002f6c]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                </div>`;
                            contentDisplay = `
                                <div class="flex items-center">
                                    <span class="bg-blue-100 text-blue-800 text-[10px] font-semibold px-2 py-0.5 rounded uppercase mr-2">Text</span>
                                    <div class="truncate max-w-[250px] md:max-w-[400px] text-gray-700 font-normal italic" title="${safeTextContent}">"${safeTextContent}"</div>
                                </div>`;
                        } else {
                            // Image Type
                            const filename = escapeHtml(item.filename || 'Image File');
                            const imgUrl = escapeHtml(item.url || '');
                            previewHtml = `
                                <div class="mx-auto h-12 w-16 bg-gray-200 rounded-md overflow-hidden shadow-sm cursor-pointer border border-gray-300 hover:border-[#00c2cb]" onclick="openModal('image', '${imgUrl}')" title="Preview Image">
                                    <img src="${imgUrl}" class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-300" alt="preview">
                                </div>`;
                            contentDisplay = `
                                <div class="flex items-center">
                                    <span class="bg-gray-200 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded uppercase mr-2">Img</span>
                                    <div class="truncate max-w-[200px] md:max-w-[300px] font-semibold text-gray-800" title="${filename}">${filename}</div>
                                </div>`;
                        }

                        // Determine select colors based on current DB state
                        const isAi = Boolean(item.is_ai);
                        const selectColorClass = isAi ? 'bg-teal-50 border-teal-200 text-teal-800' : 'bg-blue-50 border-blue-200 text-blue-800';

                        tr.innerHTML = `
                            <td class="p-2 text-center align-middle border-b border-gray-100">
                                ${previewHtml}
                            </td>
                            <td class="p-3 align-middle border-b border-gray-100">
                                ${contentDisplay}
                            </td>
                            <td class="p-3 align-middle border-b border-gray-100 text-center">
                                <!-- CHANGE ANSWER DROPDOWN -->
                                <select onchange="updateAnswer('${item.id}', this.value, this)" class="inline-block w-3/4 px-2 py-1.5 text-sm font-bold border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00c2cb] cursor-pointer transition-colors ${selectColorClass}">
                                    <option value="false" ${!isAi ? 'selected' : ''}>Real</option>
                                    <option value="true" ${isAi ? 'selected' : ''}>AI</option>
                                </select>
                            </td>
                            <td class="p-3 text-center align-middle border-b border-gray-100 whitespace-nowrap">
                                ${isText ? `
                                    <button onclick="editText('${item.id}', '${encodedContent}')" class="text-blue-600 hover:text-white border border-blue-200 hover:bg-blue-600 text-xs font-bold px-2.5 py-1.5 rounded transition-colors shadow-sm mr-1">
                                        Edit
                                    </button>
                                ` : ''}
                                <button onclick="deleteEntry('${item.id}')" class="text-red-500 hover:text-white border border-red-200 hover:bg-red-500 hover:border-red-500 text-xs font-bold px-3 py-1.5 rounded transition-colors shadow-sm">
                                    Delete
                                </button>
                            </td>
                        `;
                        historyBody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error("Failed to load history:", err);
                    document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 italic">Error loading database. Make sure server is running.</td></tr>`;
                });
        }

        // UPDATE (PATCH) an existing record's Answer
        window.updateAnswer = async function (id, newValue, selectElement) {
            const isAi = newValue === 'true';

            // Provide immediate visual feedback on the select box
            selectElement.disabled = true;
            selectElement.classList.add('opacity-50', 'animate-pulse');

            try {
                // Ensure your backend app.py has an endpoint to handle this PATCH request
                const response = await fetch(`/api/update/${id}?true=true`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_ai: isAi })
                });

                if (response.ok) {
                    // Update Colors based on new selection
                    selectElement.className = `inline-block w-3/4 px-2 py-1.5 text-sm font-bold border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00c2cb] cursor-pointer transition-colors ${isAi ? 'bg-teal-50 border-teal-200 text-teal-800' : 'bg-blue-50 border-blue-200 text-blue-800'}`;
                } else {
                    alert("Server failed to update the record.");
                    loadUploadedData(); // Revert to original data
                }
            } catch (error) {
                console.error("Error updating:", error);
                alert("Network error connecting to server.");
                loadUploadedData(); // Revert
            } finally {
                selectElement.disabled = false;
                selectElement.classList.remove('opacity-50', 'animate-pulse');
            }
        };

        // EDIT a text question entry
        window.editText = async function (id, encodedCurrentText) {
            const currentText = decodeURIComponent(encodedCurrentText);
            const newText = prompt("Edit Question Statement:", currentText);
            if (newText === null) return;
            const trimmed = newText.trim();
            if (!trimmed) {
                alert("Question text cannot be empty.");
                return;
            }
            try {
                const response = await fetch(`/api/update/${id}?true=true`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text_content: trimmed })
                });
                if (response.ok) {
                    loadUploadedData();
                } else {
                    alert("Failed to update text question.");
                }
            } catch (err) {
                console.error("Error updating text:", err);
                alert("Network error updating text question.");
            }
        };

        // DELETE an entry
        window.deleteEntry = async function (id) {
            if (!confirm("WARNING: Are you sure you want to delete this entry? This will permanently remove it from the database.")) return;

            try {
                const response = await fetch(`/api/delete/${id}?true=true`, { method: 'DELETE' });
                if (response.ok) {
                    loadUploadedData(); // Refresh UI
                } else { alert("Server failed to delete the entry."); }
            } catch (error) {
                console.error("Error deleting:", error);
                alert("Error connecting to server.");
            }
        };

        // Initial Data Load
        loadUploadedData();
    </script>
</body>

</html>
